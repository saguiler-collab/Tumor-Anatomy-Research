[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ivygap-anatomic-deconvolution"
version = "1.0.0"
description = "Cell-type deconvolution of glioblastoma by anatomic structure, using Ivy GAP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "lifelines>=0.27",
    "requests>=2.28",
]

[project.optional-dependencies]
# Only needed to build a reference from a .h5ad atlas. Never imported at module scope.
atlas = ["anndata>=0.9"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["ivygap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep the suite readable: a convergence warning per fit per sample would bury the
# actual failures under thousands of lines.
filterwarnings = [
    "ignore::UserWarning:sklearn",
    "ignore::FutureWarning",
]
